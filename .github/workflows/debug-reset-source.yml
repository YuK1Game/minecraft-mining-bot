name: Export debug reset source
on:
  push:
    branches: [fix/debug-reset-visual-20261109]
    paths: [.github/workflows/debug-reset-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz -o debug-reset-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: debug-reset-source
          path: debug-reset-source.tar.gz
          retention-days: 1
