name: Export enchant regression source
on:
  push:
    branches: [fix/loadout-enchant-hand-20261109]
    paths: [.github/workflows/enchant-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz -o enchant-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: enchant-source
          path: enchant-source.tar.gz
          retention-days: 1
