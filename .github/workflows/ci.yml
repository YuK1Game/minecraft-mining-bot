name: Bot regression CI
# A branch with a pull request used to run everything twice (push and
# pull_request). Pushes are checked on main only; branches are checked through
# their pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    name: Node 24 / ${{ matrix.os }} / safety regressions
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: New safety tests and existing compatibility tests
        run: npm run test:review
      - name: Player mode lane (the return to the base; every test must run and pass)
        run: npm run test:player
      - name: Synthetic combat budget benchmark (not live Realm)
        run: npm run benchmark:combat
  # The complete suite, compared with the base commit. It runs in three parts
  # on separate machines, and the base commit's report is kept between runs:
  # the run on main keeps the report of each commit, a pull request based on
  # that commit reads it and runs the suite once instead of twice.
  legacy-comparison:
    name: Complete suite / compare with base (part ${{ matrix.part }} of 3)
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      SUITE_SHARD: ${{ matrix.part }}/3
      SUITE_REPORT_DIR: .suite-reports
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Identify the suite dependencies, runtime and comparison code
        id: suite_inputs
        run: node scripts/compare-tests.js --cache-key >> "$GITHUB_OUTPUT"
      - name: Kept report of the base commit
        id: kept
        uses: actions/cache/restore@v4
        with:
          path: .suite-reports
          key: suite-report-v2-${{ runner.os }}-part${{ matrix.part }}of3-${{ steps.suite_inputs.outputs.key }}-${{ env.CI_BASE_SHA }}
      - name: Fail on new failures; retain pre-existing failures in report
        run: npm run test:compare
      - name: Keep this commit's report for the pull requests based on it (main)
        if: always() && github.event_name == 'push' && hashFiles(format('.suite-reports/{0}.*.json', github.sha)) != ''
        uses: actions/cache/save@v4
        with:
          path: .suite-reports
          key: suite-report-v2-${{ runner.os }}-part${{ matrix.part }}of3-${{ steps.suite_inputs.outputs.key }}-${{ github.sha }}
      - name: Keep the base report this pull request had to make
        if: always() && github.event_name == 'pull_request' && steps.kept.outputs.cache-hit != 'true' && hashFiles(format('.suite-reports/{0}.*.json', env.CI_BASE_SHA)) != ''
        uses: actions/cache/save@v4
        with:
          path: .suite-reports
          key: suite-report-v2-${{ runner.os }}-part${{ matrix.part }}of3-${{ steps.suite_inputs.outputs.key }}-${{ env.CI_BASE_SHA }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-suite-comparison-part${{ matrix.part }}
          path: test-results/
          retention-days: 14
