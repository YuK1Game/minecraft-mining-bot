name: Bot regression CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    name: Node 24 / ${{ matrix.os }} / safety regressions
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: New safety tests and existing compatibility tests
        run: npm run test:review
      - name: Synthetic combat budget benchmark (not live Realm)
        run: npm run benchmark:combat
  legacy-comparison:
    name: Complete suite / compare with base
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fail on new failures; retain pre-existing failures in report
        run: npm run test:compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-suite-comparison
          path: test-results/
          retention-days: 14
