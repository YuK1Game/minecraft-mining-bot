name: Isolated review tools
on:
  push:
    branches: [fix/review-hardening-20261107]
    paths: [.github/workflows/review-tools.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Export dependency-only test environment
        run: |
          mkdir -p review-bin
          cp "$(command -v node)" review-bin/node
          tar czf review-tools.tar.gz node_modules review-bin
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-test-tools
          path: review-tools.tar.gz
          retention-days: 1
