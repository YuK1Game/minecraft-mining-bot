name: Export quarry exit regression source
on:
  push:
    branches: [fix/quarry-bedrock-exit-20261109]
    paths: [.github/workflows/exit-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz -o quarry-exit-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: quarry-exit-source
          path: quarry-exit-source.tar.gz
          retention-days: 1
