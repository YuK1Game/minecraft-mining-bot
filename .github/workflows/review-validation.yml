name: Review validation
on:
  push:
    branches: [fix/review-hardening-20261107]
permissions:
  contents: read
concurrency:
  group: review-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Export tracked source for isolated review
        run: git archive --format=tar.gz -o review-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: review-source
          path: review-source.tar.gz
          retention-days: 3
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Syntax check
        run: npm run check
      - name: Test baseline
        run: node --test --test-concurrency=2 --test-reporter=tap > review-tests.tap 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-test-results
          path: review-tests.tap
          retention-days: 7
