name: Validate debug reset and visual inventory UI
on:
  push:
    branches: [fix/debug-reset-visual-20261109]
    paths: [.github/workflows/apply-debug-reset.yml, '.review/debug-reset.*']
permissions:
  contents: write
concurrency:
  group: apply-debug-reset-visual
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify unchanged source and exact patch
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/fix/debug-reset-visual-20261109
          git diff --exit-code c20e1f91aeccf6cd81e6a1aabbdbe30816cbb354 HEAD -- src scripts dashboard test docs README.md AGENTS.md package.json package-lock.json .gitignore
          cat .review/debug-reset.part0 .review/debug-reset.part1 > /tmp/debug-reset.patch.xz
          echo '90a00b8c938a2a60fe01b7aad6bd72073e630a9713b5adf8de64be1694601812  /tmp/debug-reset.patch.xz' | sha256sum --check
          xz -dc /tmp/debug-reset.patch.xz > /tmp/debug-reset.patch
          echo 'a5564c249fec7f4fb6e855ad393478eae8d707c7554f24c3836617f6b1ebb7d6  /tmp/debug-reset.patch' | sha256sum --check
          git apply --check --index --unidiff-zero /tmp/debug-reset.patch
          git apply --index --unidiff-zero /tmp/debug-reset.patch
          git rm -- .review/debug-reset.part0 .review/debug-reset.part1 .github/workflows/apply-debug-reset.yml
          git diff --cached --check
      - run: npm ci --ignore-scripts
      - name: Syntax and related regression tests (offline)
        shell: bash
        run: |
          npm run check
          npm run test:review > /tmp/debug-reset-regression.tap 2>&1
          node --test --test-reporter=tap --test-name-pattern='runtime dispose drains an in-flight engagement|dispose stops active mining input' test/combat.test.js test/runtime.test.js > /tmp/debug-reset-shutdown.tap 2>&1
      - name: Commit verified feature and remove temporary staging
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: allow debug loadout resets near actors and present a visual inventory kit'
          git push origin HEAD:refs/heads/fix/debug-reset-visual-20261109
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-reset-validation
          path: /tmp/debug-reset-*.tap
          retention-days: 7
