name: Export isolated restock source
on:
  push:
    branches: [fix/quarry-restock-approach-20261109]
    paths: [.github/workflows/restock-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz -o restock-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: restock-source
          path: restock-source.tar.gz
          retention-days: 1
