name: Validate restock approach
on:
  push:
    branches: [fix/quarry-restock-approach-20261109]
    paths: [.github/workflows/apply-restock.yml, '.review/restock.*']
permissions:
  contents: write
concurrency:
  group: apply-restock-approach
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify unchanged source and exact patch
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/fix/quarry-restock-approach-20261109
          git diff --exit-code 59062fcb0174f7b0e063dcf6e710ffa11ed988a6 HEAD -- src scripts dashboard test docs README.md AGENTS.md package.json package-lock.json .gitignore
          cat .review/restock.part0 .review/restock.part1 > /tmp/restock.patch.xz
          echo 'e67e7f1c4b5fa6fe5854b2dadbb3d7031dbd80c169c2fa5d09937cfbe48b8eae  /tmp/restock.patch.xz' | sha256sum --check
          xz -dc /tmp/restock.patch.xz > /tmp/restock.patch
          echo '81c492ce8103e92166e78e71c08d7185c00736c9a8e2865042e5dbd6459d49ad  /tmp/restock.patch' | sha256sum --check
          git apply --check --index /tmp/restock.patch
          git apply --index /tmp/restock.patch
          git rm -- .review/restock.part0 .review/restock.part1 .github/workflows/apply-restock.yml
          git diff --cached --check
      - run: npm ci --ignore-scripts
      - name: Syntax and restock safety regressions (offline)
        shell: bash
        run: |
          npm run check
          npm run test:review > /tmp/restock-tests.tap 2>&1
      - name: Commit tested change to feature branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: approach a verified quarry supply worksite before opening shulkers'
          git push origin HEAD:refs/heads/fix/quarry-restock-approach-20261109
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restock-approach-validation
          path: /tmp/restock-tests.tap
          retention-days: 7
