name: Validate reset inventory receipt fix
on:
  push:
    branches: [fix/loadout-inventory-receipt-20261109]
    paths: [.github/workflows/apply-receipt.yml, .review/receipt.patch.xz]
permissions:
  contents: write
concurrency:
  group: apply-reset-receipt
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source and exact patch
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/fix/loadout-inventory-receipt-20261109
          git diff --exit-code b16c8acde32588ce6b30ae9853363eb695de4186 HEAD -- src scripts dashboard test docs README.md AGENTS.md package.json package-lock.json .gitignore
          echo '8e43caf6390811d05cba0c959725001113f4f9483c62185403a82d5071500804  .review/receipt.patch.xz' | sha256sum --check
          xz -dc .review/receipt.patch.xz > /tmp/receipt.patch
          echo '134bfb3e2965503b85ad1d4a950e57068c0c3811393507a7ea60cedd2d2fdc81  /tmp/receipt.patch' | sha256sum --check
          git apply --check --index /tmp/receipt.patch
          git apply --index /tmp/receipt.patch
          git rm -- .review/receipt.patch.xz .github/workflows/apply-receipt.yml
          git diff --cached --check
      - run: npm ci --ignore-scripts
      - name: Syntax and related regressions without Realm credentials
        shell: bash
        run: |
          npm run check
          npm run test:review > /tmp/receipt-tests.tap 2>&1
      - name: Commit verified fix and remove temporary staging
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bootstrap missing debug-reset equipment receipts after confirmation'
          git push origin HEAD:refs/heads/fix/loadout-inventory-receipt-20261109
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reset-receipt-validation
          path: /tmp/receipt-tests.tap
          retention-days: 7
