name: Validate loadout lifecycle follow-up
on:
  push:
    branches: [feat/shulker-loadout-reset-20261108]
    paths: [.github/workflows/apply-loadout.yml, '.review/loadout.*']
permissions:
  contents: write
concurrency:
  group: apply-shulker-loadout
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply bounded lifecycle and fixture follow-up
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/feat/shulker-loadout-reset-20261108
          git diff --exit-code e5c8b2637eb4a08553f268f0382358e3009e8bca HEAD -- src scripts dashboard test docs README.md AGENTS.md package.json package-lock.json .gitignore
          git apply --check --index .review/loadout.followup.patch
          git apply --index .review/loadout.followup.patch
          git rm -- .review/loadout.followup.patch .github/workflows/apply-loadout.yml
          git diff --cached --check
      - run: npm ci --ignore-scripts
      - name: Syntax, safety and synchronous-stop regressions
        shell: bash
        run: |
          npm run check
          npm run test:review > /tmp/loadout-tests.tap 2>&1
          node --test --test-reporter=tap --test-name-pattern='runtime dispose drains an in-flight engagement|dispose stops active mining input' test/combat.test.js test/runtime.test.js > /tmp/loadout-dispose-tests.tap 2>&1
      - name: Commit verified source and remove staging workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve synchronous shutdown and isolate legacy combat regression fixture'
          git push origin HEAD:refs/heads/feat/shulker-loadout-reset-20261108
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loadout-final-validation
          path: /tmp/loadout*-tests.tap
          retention-days: 7
