name: Verify enchant hand synchronization
on:
  push:
    branches: [fix/loadout-enchant-hand-20261109]
    paths: [.github/workflows/apply-enchant.yml, .review/enchant.patch.xz]
permissions:
  contents: write
concurrency:
  group: apply-enchant-hand-fix
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact source and patch
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/fix/loadout-enchant-hand-20261109
          git diff --exit-code d3228720d12e98d012570f820b9fe6d1190b3ae6 HEAD -- src scripts dashboard test docs README.md AGENTS.md package.json package-lock.json .gitignore
          echo 'ae66639a02bb227fb02fd67d2c936ec6f69f2c7372b00f3ef0c1fdcb3f5ed5a7  .review/enchant.patch.xz' | sha256sum --check
          xz -dc .review/enchant.patch.xz > /tmp/enchant-hand.patch
          echo '134ee425a82b0317be7123e5bbd298fca2412dd69e0866ad11f95db10b8aeea1  /tmp/enchant-hand.patch' | sha256sum --check
          git apply --check --index /tmp/enchant-hand.patch
          git apply --index /tmp/enchant-hand.patch
          git rm -- .review/enchant.patch.xz .github/workflows/apply-enchant.yml
          git diff --cached --check
      - run: npm ci --ignore-scripts
      - name: Syntax and related regressions (no Realm credentials)
        shell: bash
        run: |
          npm run check
          npm run test:review > /tmp/enchant-tests.tap 2>&1
      - name: Commit verified fix to feature branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: synchronize server main hand before enchanting debug loadout items'
          git push origin HEAD:refs/heads/fix/loadout-enchant-hand-20261109
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enchant-hand-validation
          path: /tmp/enchant-tests.tap
          retention-days: 7
