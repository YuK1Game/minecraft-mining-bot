name: Validate and apply dashboard visual UI
on:
  push:
    branches: [feat/dashboard-visual-ui-20261108]
    paths: [.github/workflows/apply-dashboard-visual.yml, '.review/visual.*']
permissions:
  contents: write
concurrency:
  group: apply-dashboard-visual
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify source and patch
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/feat/dashboard-visual-ui-20261108
          git diff --exit-code c6242d98f763d3bf971168b57105a87e6b54d6e3 HEAD -- dashboard test
          cat .review/visual.part0 .review/visual.part1 > /tmp/dashboard-visual.patch.xz
          echo '45edd77c96d83e9aac0c4fd5a76634994be44bebbec7a2bf45d897986397360c  /tmp/dashboard-visual.patch.xz' | sha256sum --check
          xz -dc /tmp/dashboard-visual.patch.xz > /tmp/dashboard-visual.patch
          echo '9dd723cb9748cafb5f5e42115d2f4fee4ef98d4916fac3b7a28ed61c510ac613  /tmp/dashboard-visual.patch' | sha256sum --check
          git apply --check --index --unidiff-zero /tmp/dashboard-visual.patch
          git apply --index --unidiff-zero /tmp/dashboard-visual.patch
          git diff --cached --check
      - run: npm ci --ignore-scripts
      - name: Syntax and related regressions without Realm credentials
        shell: bash
        run: |
          npm run check
          npm run test:review > /tmp/dashboard-visual-tests.tap 2>&1
      - name: Commit verified UI only to feature branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: replace dashboard subtext with visual chunk selection and compact controls'
          git push origin HEAD:refs/heads/feat/dashboard-visual-ui-20261108
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-visual-validation
          path: /tmp/dashboard-visual-tests.tap
          retention-days: 7
