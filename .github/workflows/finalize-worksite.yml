name: Validate diagnostic-only combat logging
on:
  push:
    branches: [fix/quarry-worksite-diagnostics-20261109]
    paths: [.github/workflows/finalize-worksite.yml, .review/worksite-diagnostic-only.patch]
permissions:
  contents: write
concurrency:
  group: apply-worksite-terrain
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preserve original combat action gate and apply diagnostics only
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/fix/quarry-worksite-diagnostics-20261109
          git diff --exit-code 62d61d31885f53452a3b0a8aff06f81470c6dacc HEAD -- src scripts dashboard test docs package.json package-lock.json
          git apply --check --index .review/worksite-diagnostic-only.patch
          git apply --index .review/worksite-diagnostic-only.patch
          git rm -- .review/worksite-diagnostic-only.patch .github/workflows/finalize-worksite.yml
          git diff --cached --check
          node <<'NODE'
          const fs = require('node:fs'), cp = require('node:child_process'), assert = require('node:assert/strict');
          const old = cp.execFileSync('git',['show','f4bc10dd0f790f2819474bce9bb552e12f350a00:src/runtime.js'],{encoding:'utf8',maxBuffer:4000000});
          const now = fs.readFileSync('src/runtime.js','utf8');
          const start = '    function verifyStrikeBody (';
          assert.equal(now.slice(now.indexOf(start),now.indexOf('    function strikeBodyDiagnostic (')),old.slice(old.indexOf(start),old.indexOf('    // Stationary combat can continue',old.indexOf(start))));
          NODE
      - run: npm ci --ignore-scripts
      - name: Syntax and related regressions
        shell: bash
        run: |
          npm run check
          npm run test:review > /tmp/worksite-gate-tests.tap 2>&1
      - name: Commit verified final source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: keep combat action gate unchanged and diagnose rejected poses only'
          git push origin HEAD:refs/heads/fix/quarry-worksite-diagnostics-20261109
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worksite-gate-validation
          path: /tmp/worksite-gate-tests.tap
          retention-days: 7
