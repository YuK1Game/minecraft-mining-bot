name: Finalize worksite diagnostics
on:
  push:
    branches: [fix/quarry-worksite-diagnostics-20261109]
    paths: [.github/workflows/finalize-worksite.yml, .review/worksite-order.patch]
permissions:
  contents: write
concurrency:
  group: apply-worksite-terrain
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Keep existing isolated-test function boundary without altering behavior
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/fix/quarry-worksite-diagnostics-20261109
          git diff --exit-code d81b0aaf09348acbd0c77e8824e3cc588df3607c HEAD -- src scripts dashboard test docs package.json package-lock.json
          git apply --check --index .review/worksite-order.patch
          git apply --index .review/worksite-order.patch
          git rm -- .review/worksite-order.patch .github/workflows/finalize-worksite.yml
          git diff --cached --check
      - run: npm ci --ignore-scripts
      - name: Syntax and related regressions
        shell: bash
        run: |
          npm run check
          npm run test:review > /tmp/worksite-final-tests.tap 2>&1
      - name: Commit verified final source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: preserve isolated idle-ownership function boundary'
          git push origin HEAD:refs/heads/fix/quarry-worksite-diagnostics-20261109
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worksite-final-validation
          path: /tmp/worksite-final-tests.tap
          retention-days: 7
