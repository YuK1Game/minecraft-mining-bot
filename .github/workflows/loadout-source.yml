name: Prepare isolated loadout source
on:
  push:
    branches: [feat/shulker-loadout-reset-20261108]
    paths: [.github/workflows/loadout-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz -o loadout-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: loadout-source
          path: loadout-source.tar.gz
          retention-days: 1
